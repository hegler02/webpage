# Once a day: add new The Mirinaeman Project videos and music to the home rails and publish through the usual gate.
name: Channel rails

on:
  schedule:
    - cron: "0 21 * * *"  # 06:00 in Korea
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/channel.yml", "tools/update_channel.py", "pages/profile/data/channel.json"]  # also when the rails themselves change

permissions:
  contents: write

concurrency:
  group: channel-rails
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Read the channels on YouTube
        run: python tools/update_channel.py
      - name: Publish when a rail changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new"; exit 0; fi
          python tools/render_archive.py
          python tools/release_gate.py
          git config user.name "mirinaeman-channel-rails"
          git config user.email "hegler02@users.noreply.github.com"
          git add -A
          git commit -m "Add new The Mirinaeman Project videos or music to the home rails"
          git push
