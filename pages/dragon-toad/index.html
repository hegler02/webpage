#dock{position:fixed;z-index:4;left:50%;bottom:0;transform:translateX(-50%);width:min(580px,calc(100% - 32px));
 margin-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;align-items:center;padding:8px 10px;
 background:var(--paper-glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
#dock button{border:0;background:none;color:var(--ink);font:inherit;padding:8px 6px;cursor:pointer;white-space:nowrap;min-height:40px}
button:focus-visible,#seek:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
#speed{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#sound{color:var(--seal)}
#sound[aria-pressed="true"]{color:var(--ink-soft)}

#seek{flex:1;min-width:40px;accent-color:var(--seal)}

#end{position:fixed;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:14px;padding:16px 16px 120px;text-align:center;background:var(--paper-veil)}

<canvas id="gl" role="img" aria-label="홍칠공의 장풍이 먹의 흐름이 되어 용으로 맺히며 내려가고, 구양봉의 합마공은 두꺼비로 맺혀 휘돌아 오른다. 두 기운이 맞닿아 밀어붙이다 먹으로 터진다."></canvas>

 <p class="eyebrow">降龍十八掌 · 蛤蟆功</p>

 <p class="credit">김용의 인물과 무공에서 착안한 비공식 창작 장면<br>AI 수묵 원화 · 실시간 먹 유체 · 합성 효과음</p>
</div>
<nav id="dock" aria-label="재생 제어">
 <button id="play" type="button">재생</button>
 <button id="restart" type="button">처음부터</button>

 <input id="seek" type="range" min="0" max="31" step="0.05" value="0" aria-label="시간">
 <output id="time">0.0s</output>
</nav>
