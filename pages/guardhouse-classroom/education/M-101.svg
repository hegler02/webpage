<svg xmlns="http://www.w3.org/2000/svg" id="learning-plan" viewBox="0 0 1000 710" role="group" aria-label="M-101 외벽 재료 구성도 연결 도면"><rect width="1000" height="710" fill="#f8fafb"/><text x="65" y="70" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#294654">벽은 한 가지 재료로 이루어지지 않습니다.</text><text x="65" y="110" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#294654">외부 → 외장·바탕·단열 → 콘크리트 → 실내</text><rect x="120" y="180" width="60" height="260" rx="5" fill="#ddd4c2" stroke="#718b95" stroke-width="1.5" data-element="material-finish" role="button" tabindex="0" aria-label="외장 마감 도면에서 선택"/><line x1="150" y1="440" x2="120" y2="490" stroke="#718b95" stroke-width="1"/><text x="73" y="515" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">외장 마감</text><text x="73" y="539" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">20 mm</text><rect x="180" y="180" width="45" height="260" rx="5" fill="#9eaaa9" stroke="#718b95" stroke-width="1.5" data-element="material-support" role="button" tabindex="0" aria-label="부착·바탕층 도면에서 선택"/><line x1="202.5" y1="440" x2="290" y2="555" stroke="#718b95" stroke-width="1"/><text x="243" y="580" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">부착·바탕층</text><text x="243" y="604" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">10 mm</text><rect x="225" y="180" width="140" height="260" rx="5" fill="#d9be70" stroke="#718b95" stroke-width="1.5" data-element="material-insulation" role="button" tabindex="0" aria-label="단열층 도면에서 선택"/><line x1="295" y1="440" x2="460" y2="490" stroke="#718b95" stroke-width="1"/><text x="413" y="515" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">단열층</text><text x="413" y="539" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">70 mm</text><rect x="365" y="180" width="280" height="260" rx="5" fill="#a9b4b5" stroke="#718b95" stroke-width="1.5" data-element="material-concrete" role="button" tabindex="0" aria-label="철근콘크리트 외벽 도면에서 선택"/><line x1="505" y1="440" x2="630" y2="555" stroke="#718b95" stroke-width="1"/><text x="583" y="580" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">철근콘크리트 외벽</text><text x="583" y="604" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">200 mm</text><rect x="645" y="180" width="45" height="260" rx="5" fill="#eae5d8" stroke="#718b95" stroke-width="1.5" data-element="material-lining" role="button" tabindex="0" aria-label="실내 마감 도면에서 선택"/><line x1="667.5" y1="440" x2="800" y2="490" stroke="#718b95" stroke-width="1"/><text x="753" y="515" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">실내 마감</text><text x="753" y="539" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#294654">15 mm</text><text x="120" y="157" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#294654">바깥쪽</text><text x="720" y="157" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#294654">실내쪽</text><text x="65" y="625" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#294654">선택 외관: 밝은 미장 마감 · 전체 315 mm</text><text x="65" y="650" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#294654">층을 읽기 위한 개념도 (가로 비례 일부 확대) · 외장 영역 100 = 20 + 10 + 70 mm</text><line x1="40" y1="675" x2="960" y2="675" stroke="#c8d7de"/><text x="45" y="699" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#294654">M-101 · 외벽 재료 구성도 · 경비실 교육용 샘플 1</text></svg>