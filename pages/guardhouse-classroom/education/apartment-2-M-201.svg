<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="group" aria-label="M-201 외벽 재료 구성도"><defs><marker id="exit-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#248976"/></marker></defs><rect width="1000" height="820" fill="#f9fbfb"/><g font-family="Malgun Gothic, sans-serif" fill="#2c4e59"><text x="55" y="42" font-size="20" font-weight="700">M-201 · 외벽 재료 구성도</text><text x="55" y="67" font-size="12">교육용 샘플 2 · 자체 제작 평면 · 방별 내부면적 합계 58.5 ㎡</text><text x="75" y="115" font-size="22" font-weight="700">외기에 접하는 외벽</text><g data-object="assembly-exterior-wallpaper" tabindex="0" role="button" aria-label="실내 벽지·바탕 도면에서 선택"><rect x="80" y="140" width="24" height="180" fill="#e9e5db" stroke="#6e8586"/></g><g data-object="assembly-exterior-rc" tabindex="0" role="button" aria-label="철근콘크리트 도면에서 선택"><rect x="120" y="140" width="180" height="180" fill="#9ca29e" stroke="#6e8586"/></g><g data-object="assembly-exterior-wool" tabindex="0" role="button" aria-label="미네랄울 단열층 도면에서 선택"><rect x="316" y="140" width="90" height="180" fill="#c8b485" stroke="#6e8586"/></g><g data-object="assembly-exterior-render" tabindex="0" role="button" aria-label="보강 바탕·외장 마감 도면에서 선택"><rect x="422" y="140" width="24" height="180" fill="#c7c6be" stroke="#6e8586"/></g><text x="540" y="160" font-size="17">1. 실내 벽지·바탕 · 1 mm</text><text x="540" y="195" font-size="17">2. 철근콘크리트 · 200 mm</text><text x="540" y="230" font-size="17">3. 미네랄울 단열층 · 100 mm</text><text x="540" y="265" font-size="17">4. 보강 바탕·외장 마감 · 15 mm</text><text x="75" y="760" font-size="14">층을 눌러 역할을 확인하세요. 얇은 층은 선택하기 쉽도록 확대 표시했습니다.</text></g></svg>