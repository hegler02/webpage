<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="group" aria-label="M-203 바닥 재료 구성도"><defs><marker id="exit-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#248976"/></marker></defs><rect width="1000" height="820" fill="#f9fbfb"/><g font-family="Pretendard Variable, Pretendard, sans-serif" fill="#2c4e59"><text x="55" y="42" font-size="20" font-weight="700">M-203 · 바닥 재료 구성도</text><text x="55" y="67" font-size="12">교육용 샘플 2 · 자체 제작 평면 · 방별 내부면적 합계 58.5 ㎡</text><text x="75" y="115" font-size="22" font-weight="700">거실·침실 바닥</text><g data-object="assembly-floor-wood" tabindex="0" role="button" aria-label="마루 마감 도면에서 선택"><rect x="80" y="140" width="24" height="180" fill="#c7a77f" stroke="#6e8586"/></g><g data-object="assembly-floor-screed" tabindex="0" role="button" aria-label="난방 배관을 감싸는 모르타르 도면에서 선택"><rect x="120" y="140" width="46.800000000000004" height="180" fill="#c1bab0" stroke="#6e8586"/></g><g data-object="assembly-floor-floor-insulation" tabindex="0" role="button" aria-label="바닥 단열층 도면에서 선택"><rect x="182.8" y="140" width="36" height="180" fill="#d8c89d" stroke="#6e8586"/></g><g data-object="assembly-floor-impact" tabindex="0" role="button" aria-label="바닥 완충층 도면에서 선택"><rect x="234.8" y="140" width="24" height="180" fill="#8fa6a0" stroke="#6e8586"/></g><g data-object="assembly-floor-slab" tabindex="0" role="button" aria-label="철근콘크리트 구조 바닥판 도면에서 선택"><rect x="274.8" y="140" width="189" height="180" fill="#929c98" stroke="#6e8586"/></g><text x="540" y="160" font-size="17">1. 마루 마감 · 8 mm</text><text x="540" y="195" font-size="17">2. 난방 배관을 감싸는 모르타르 · 52 mm</text><text x="540" y="230" font-size="17">3. 바닥 단열층 · 40 mm</text><text x="540" y="265" font-size="17">4. 바닥 완충층 · 20 mm</text><text x="540" y="300" font-size="17">5. 철근콘크리트 구조 바닥판 · 210 mm</text><text x="75" y="760" font-size="14">층을 눌러 역할을 확인하세요. 얇은 층은 선택하기 쉽도록 확대 표시했습니다.</text></g></svg>