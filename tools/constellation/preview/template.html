<title>미리내맨 은하수 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the galaxy fills the screen; every control floats over it and the record card opens beside the star. */
@font-face{font-family:"Pretendard Variable";src:url(data:font/woff2;base64,FONTDATA) format("woff2");font-weight:45 920;font-display:block}
:root{
 color-scheme:dark;
 --bg:#060912;--panel:#0e1422f2;--raised:#182136;--line:#2a3550;--text:#eef1f8;--muted:#a3afc6;--faint:#7c89a4;--accent:#8fb0ff;
 --song:#7fb2ff;--slide:#7fe3cf;--screen:#ff9f7d;--story:#e4b3ff;--knowledge:#ffd27a;--thought:#d9c7ff;--proposal:#ffcf9e;--paper:#9fe6ff;
 --sans:"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --edge-left:max(16px,env(safe-area-inset-left,0px));--edge-right:max(16px,env(safe-area-inset-right,0px));
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--r:10px;--reader:372px;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#121c3a 0,#0a0f20 42%,var(--bg) 74%)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;outline:0;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}#gl.point{cursor:pointer}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#060912b3 0,#06091200 26%),linear-gradient(0deg,#06091299 0,#06091200 22%)}
#labels{position:absolute;z-index:1;inset:0;overflow:hidden;pointer-events:none}
.lb{position:absolute;left:0;top:0;visibility:hidden;display:flex;align-items:center;gap:var(--s1);padding:0;border:0;background:none;white-space:nowrap;pointer-events:auto;will-change:transform;text-shadow:0 0 6px var(--bg),0 0 14px var(--bg);color:var(--text);font-size:12.5px;line-height:1.3}
.lb.on{visibility:visible}
.lb span{max-width:13em;overflow:hidden;text-overflow:ellipsis}
.lb.thought span,.lb.topic span{padding:3px 10px;border:1px solid #d9c7ff66;border-radius:99px;background:#1a1730d9;color:var(--thought);font-weight:600;text-shadow:none}
.lb.proposal span{padding:3px 10px;border:1px dashed #ffcf9e88;border-radius:99px;background:#241a10d9;color:var(--proposal);font-weight:600;text-shadow:none}
.lb.topic span{border-color:#9fe6ff55;background:#0f2230d9;color:var(--paper)}
.lb.core span{padding:3px 12px;border:1px solid #fff1d666;border-radius:99px;background:#241d14d9;color:#fff1d6;font-weight:700;text-shadow:none}
.lb.card{flex-direction:column;align-items:flex-start;gap:3px}
.lb.card img{display:block;width:124px;aspect-ratio:16/9;object-fit:cover;border:1px solid #ffffff33;border-radius:7px;box-shadow:0 6px 22px #000a}
.lb.card.mini img{width:68px;border-radius:5px}
.lb.card.mini span{font-size:11.5px}
.lb.sel span{color:#fff;font-weight:700}
.lb:hover span{color:#fff}
.edge{position:absolute;left:0;top:0;visibility:hidden;padding:1px 7px;border-radius:99px;background:#0a0f20cc;color:var(--muted);font-size:11px;white-space:nowrap;pointer-events:none}
.edge.on{visibility:visible}

.head,.foot,#reader,#fallback{z-index:2}
.head{position:absolute;left:var(--edge-left);top:var(--s4);display:grid;gap:var(--s1);max-width:min(30rem,calc(100% - 32px));pointer-events:none}
.head h1{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.025em}
.head p{color:var(--muted);font-size:13px}
.search{position:relative;pointer-events:auto;margin-top:var(--s2);width:min(19rem,100%)}
.search input{width:100%;height:36px;padding-inline:var(--s3);border:1px solid var(--line);border-radius:var(--r);background:#0e1422d9;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--faint)}
.results{position:absolute;left:0;right:0;top:40px;z-index:5;display:grid;max-height:44vh;overflow:auto;padding:var(--s1);border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.results button{padding:var(--s1) var(--s2);border:0;border-radius:6px;background:none;text-align:left;font-size:13.5px}
.results button:hover,.results button:focus-visible{background:var(--raised)}
.results p{padding:var(--s1) var(--s2);color:var(--muted);font-size:13px}

.foot{position:absolute;left:var(--edge-left);bottom:var(--s4);display:grid;gap:var(--s2);max-width:calc(100% - 32px);pointer-events:none}
.legend,.trail,.tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2);pointer-events:auto}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border:1px solid transparent;border-radius:99px;background:#0e142299;color:var(--muted);font-size:12.5px}
.legend button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.legend button[aria-pressed=true]{border-color:var(--c);color:#fff}
.key{color:var(--faint);font-size:12px}
.trail span{color:var(--faint);font-size:12px}
.trail button{padding:1px 8px;border:0;border-radius:99px;background:#182136cc;font-size:12.5px;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools button{min-height:32px;padding-inline:var(--s3);border:1px solid var(--line);border-radius:var(--r);background:#0e1422d9;font-size:13px}
.tools button:hover{background:var(--raised)}

#reader{position:absolute;right:var(--edge-right);top:var(--s4);bottom:var(--s4);width:min(var(--reader),calc(100% - 32px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);overflow:hidden}
.reader-top{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4) 0}
.reader-top b{color:var(--c,var(--accent));font-size:12.5px;font-weight:600}
.reader-top button{margin-left:auto;width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:18px;line-height:1}
.reader-top button:hover{background:var(--raised);color:#fff}
.reader-body{flex:1;min-height:0;overflow:auto;padding:var(--s2) var(--s4) var(--s4);display:grid;align-content:start;gap:var(--s3)}
.reader-body h2{font-size:20px;line-height:1.35;font-weight:700;letter-spacing:-.025em}
.reader-body img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.reader-body .sum{color:#cfd6e6}
.open{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:var(--r);background:var(--accent);color:#0b1020;font-weight:700;text-decoration:none}
.ctx h3{margin-top:var(--s2);color:var(--muted);font-size:13px;font-weight:600}
.ctx ul{display:grid;gap:var(--s1);margin:var(--s2) 0 0;padding:0;list-style:none}
.ctx li button{display:grid;gap:1px;width:100%;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r);background:none;text-align:left}
.ctx li button:hover{background:var(--raised)}
.ctx .why{color:var(--accent);font-size:12px;font-weight:600}
.ctx .why.p{color:var(--proposal)}
.ctx .to{font-weight:600}
.prop-list{display:grid;gap:var(--s1);margin:0;padding:0;list-style:none}
.prop-list button{display:grid;gap:1px;width:100%;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r);background:none;text-align:left}
.prop-list button:hover{background:var(--raised)}
.prop-list b{color:var(--proposal);font-weight:600}
.prop-list span{color:var(--muted);font-size:12.5px;line-height:1.5}
.ctx .note{color:var(--muted);font-size:12.5px;line-height:1.5}
.none{color:var(--muted);font-size:13px}
#fallback{position:absolute;inset:auto 16px 16px;color:var(--muted)}
@media(max-width:820px){
 .head h1{font-size:18px}.head p{display:none}
 #reader{left:var(--edge-left);right:var(--edge-right);top:auto;bottom:var(--s2);width:auto;height:52%}
 .foot{bottom:var(--s2)}
 .key{display:none}
 body[data-open] .foot{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div id="app">
 <canvas id="gl" tabindex="0" aria-label="미리내맨 은하수. 드래그로 회전, 휠로 확대, 방향키로 둘러볼 수 있습니다. 검색창에서 기록을 찾아 열 수 있습니다."></canvas>
 <div id="labels"></div>
 <header class="head">
  <h1>미리내맨 은하수</h1>
  <p id="count"></p>
  <div class="search"><input id="q" type="search" placeholder="작품과 생각 찾기" aria-label="작품과 생각 찾기" autocomplete="off"><div class="results" id="results" hidden></div></div>
 </header>
 <footer class="foot">
  <div class="trail" id="trail" hidden></div>
  <div class="legend" id="legend"></div>
  <p class="key">밝은 선은 기록된 맥락, 가까운 별은 같은 갈래입니다.</p>
  <div class="tools"><button type="button" id="all">은하 전체 보기</button><button type="button" id="plist">제안한 별자리 16개</button><button type="button" id="ptoggle" aria-pressed="true">제안 연결 숨기기</button></div>
 </footer>
 <aside id="reader" hidden aria-label="선택한 기록"></aside>
 <p id="fallback" hidden>이 기기에서 3차원 화면을 열 수 없습니다. 검색창으로 기록을 찾아 볼 수 있습니다.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(()=>{
const GRAPH=/*GRAPH*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KINDS={song:['노래','--song'],slide:['슬라이드','--slide'],screen:['영상','--screen'],story:['이야기','--story'],knowledge:['배움','--knowledge'],paper:['논문','--paper']};
const LABEL={proposal:'제안한 별자리',song:'노래',slide:'슬라이드',screen:'영상',story:'이야기',knowledge:'배움',paper:'논문',concept:'생각',topic:'연구 주제',judgment:'제작 판단',essay:'글',creator:'창작자'};
const css=getComputedStyle(document.documentElement);
const colorOf=k=>{const v=KINDS[k]?.[1]??(k==='topic'?'--paper':k==='proposal'?'--proposal':k==='creator'?null:'--thought');return v?css.getPropertyValue(v).trim():'#fff1d6';};
const nodes=GRAPH.nodes,byId=new Map(nodes.map((n,i)=>{n.i=i;return [n.id,n];}));
const edges=GRAPH.edges.map(e=>({...e,A:byId.get(e.a),B:byId.get(e.b)}));
const near=new Map(nodes.map(n=>[n.id,[]]));
edges.forEach(e=>{near.get(e.a).push({e,o:e.B});near.get(e.b).push({e,o:e.A});});
const recordedCount=edges.filter(e=>!e.hub&&!e.prop).length,propCount=edges.filter(e=>e.prop).length;
const hubs=nodes.filter(n=>n.k==='proposal');
$('count').textContent=`기록된 맥락 ${recordedCount}개 · 제안한 연결 ${propCount}개`;

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let selected=null,hover=null,kindFilter=null,matches=null,trail=[];
const reader=$('reader'),labelsHost=$('labels');

/* Record card */
function kinRows(n){return n.kin.map(id=>byId.get(id)).filter(Boolean);}
function openReader(n){
 document.body.dataset.open='';
 const rel=near.get(n.id).filter(x=>!x.e.hub&&!hiddenEdge(x.e));
 const kin=rel.length?[]:kinRows(n);
 const rows=rel.slice(0,24).map(x=>`<li><button type="button" data-go="${esc(x.o.id)}"><span class="why ${x.e.prop?'p':''}">${x.e.prop?'제안 · ':''}${esc(x.e.l)}</span><span class="to">${esc(x.o.t)}</span><span class="note">${esc(x.e.r)}</span></button></li>`).join('');
 const kinHtml=kin.map(o=>`<li><button type="button" data-go="${esc(o.id)}"><span class="to">${esc(o.t)}</span><span class="note">${esc(LABEL[o.k]||'')}</span></button></li>`).join('');
 reader.style.setProperty('--c',colorOf(n.k));
 reader.innerHTML=`<div class="reader-top"><b>${esc(LABEL[n.k]||'')}${n.y?' · '+esc(n.y):''}</b><button type="button" id="close" aria-label="닫기">×</button></div>
 <div class="reader-body"><h2 id="reader-title" tabindex="-1">${esc(n.t)}</h2>${n.img?`<img src="${n.img}" alt="${esc(n.alt)}">`:''}<p class="sum">${esc(n.s)}</p> ${n.k==='proposal'?`<p class="none">이름과 설명은 초안입니다. 고치거나 빼실 수 있습니다.</p>`:''}${n.u?`<a class="open" href="${esc(n.u)}" target="_blank" rel="noopener">${n.k==='paper'?'출처 보기':isThought(n)?'자세히 읽기':'작품 보기'} ↗</a>`:''}
 <section class="ctx">${rel.length?`<h3>${n.k==='proposal'?'이 별자리에 넣자고 제안한 기록':'이어지는 맥락'} ${rel.length}개</h3><ul>${rows}</ul>`:`<p class="none">아직 기록된 맥락이 없는 별입니다.</p>${kin.length?`<h3>같은 갈래의 기록</h3><ul>${kinHtml}</ul>`:''}`}</section></div>`;
 reader.hidden=false;
 $('close').addEventListener('click',()=>select(null));
 reader.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(byId.get(b.dataset.go))));
}
function renderTrail(){
 const t=$('trail');t.hidden=!trail.length;
 t.innerHTML=trail.length?`<span>지나온 별</span>`+trail.map(n=>`<button type="button" data-go="${esc(n.id)}">${esc(n.t)}</button>`).join(''):'';
 t.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(byId.get(b.dataset.go))));
}
function select(n,{fly=true}={}){
 selected=n;
 if(n){if(trail.at(-1)!==n)trail=[...trail.filter(x=>x!==n).slice(-4),n];openReader(n);renderTrail();}
 else{reader.hidden=true;delete document.body.dataset.open;}
 scene?.onSelect(fly);
}

/* Legend and search */
$('legend').innerHTML=Object.entries(KINDS).map(([k,[name,v]])=>`<button type="button" data-k="${k}" aria-pressed="false" style="--c:var(${v})"><i></i>${name}</button>`).join('')+`<button type="button" data-k="thought" aria-pressed="false" style="--c:var(--thought)"><i></i>생각</button>`;
$('legend').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;kindFilter=kindFilter===b.dataset.k?null:b.dataset.k;$('legend').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.k===kindFilter)));});
const isThought=n=>['concept','topic','judgment','essay','proposal'].includes(n.k);
let showProposals=true;
const hiddenEdge=e=>e.prop&&!showProposals;
$('q').addEventListener('input',()=>{
 const q=$('q').value.trim().toLowerCase(),box=$('results');
 if(!q){matches=null;box.hidden=true;return;}
 const hit=nodes.filter(n=>(n.t+' '+n.s+' '+n.tags.join(' ')).toLowerCase().includes(q));
 matches=new Set(hit.map(n=>n.id));box.hidden=false;
 box.innerHTML=hit.length?hit.slice(0,8).map(n=>`<button type="button" data-go="${esc(n.id)}">${esc(n.t)}</button>`).join(''):'<p>찾는 기록이 없습니다.</p>';
 box.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const n=byId.get(b.dataset.go);$('q').value='';matches=null;box.hidden=true;select(n);}));
});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){$('results').querySelector('[data-go]')?.click();}if(e.key==='Escape'){$('q').value='';matches=null;$('results').hidden=true;}});
$('all').addEventListener('click',()=>select(null));
$('plist').textContent=`제안한 별자리 ${hubs.length}개`;
$('plist').addEventListener('click',()=>{
 selected=null;scene?.onSelect(true);document.body.dataset.open='';
 reader.style.setProperty('--c',css.getPropertyValue('--proposal'));
 reader.innerHTML=`<div class="reader-top"><b>제안한 별자리 ${hubs.length}개</b><button type="button" id="close" aria-label="닫기">×</button></div><div class="reader-body"><p class="sum">공개된 소개 문장을 읽고 제가 묶은 초안입니다. 이름도 묶음도 교수님 판단으로 고칠 수 있습니다.</p><ul class="prop-list">${hubs.map((h,i)=>`<li><button type="button" data-go="${esc(h.id)}"><b>${i+1}. ${esc(h.t)} · ${near.get(h.id).length}개</b><span>${esc(h.s)}</span></button></li>`).join('')}</ul></div>`;
 reader.hidden=false;scene?.onSelect(false);
 $('close').addEventListener('click',()=>select(null));
 reader.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(byId.get(b.dataset.go))));
});
$('ptoggle').addEventListener('click',e=>{showProposals=!showProposals;e.target.setAttribute('aria-pressed',String(showProposals));e.target.textContent=showProposals?'제안 연결 숨기기':'제안 연결 보기';$('count').textContent=showProposals?`기록된 맥락 ${recordedCount}개 · 제안한 연결 ${propCount}개`:`기록된 맥락 ${recordedCount}개`;if(selected&&selected.k==='proposal')select(null);else if(selected)openReader(selected);});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.target.closest('input'))select(null);});

/* Scene */
let scene=null;
function start(){
 const T=window.THREE;const canvas=$('gl');
 const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 const world=new T.Scene(),camera=new T.PerspectiveCamera(46,1,.1,240);
 const vs=`attribute float aSize;attribute float aGlow;varying vec3 vC;varying float vG;uniform float uScale;uniform float uMax;uniform float uNear;void main(){vC=color;vec4 p=modelViewMatrix*vec4(position,1.);vG=aGlow*smoothstep(uNear*.3,uNear,-p.z);gl_PointSize=min(aSize*uScale*(1.+.6*max(aGlow-1.,0.))/-p.z,uMax);gl_Position=projectionMatrix*p;}`;
 const fs=`varying vec3 vC;varying float vG;uniform float uAlpha;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;float a=exp(-d*d*5.5)*.55+exp(-d*d*48.)*.8;a*=min(vG,1.5)*uAlpha;gl_FragColor=vec4(vC*a,a);}`;
 const mat=(alpha,max=48,near=.1)=>new T.ShaderMaterial({vertexShader:vs,fragmentShader:fs,uniforms:{uScale:{value:300},uAlpha:{value:alpha},uMax:{value:max},uNear:{value:near}},vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending});
 let seed=1909;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
 const gauss=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());
 const color=c=>new T.Color(c);

 /* The nebula grows where the records and their links are. */
 const dp=[],dc=[],ds=[],dg=[];
 const dust=(x,y,z,c,s)=>{dp.push(x,y,z);dc.push(c.r,c.g,c.b);ds.push(s);dg.push(1);};
 const small=innerWidth<820?.55:1;
 nodes.forEach(n=>{const c=color(colorOf(n.k)),count=Math.round((10+Math.min(n.d,10)*7)*small),spread=.34+Math.min(n.d,10)*.07;
  for(let i=0;i<count;i++)dust(n.p[0]+gauss()*spread,n.p[1]+gauss()*spread*.4,n.p[2]+gauss()*spread,c,.25+rnd()*.8);});
 const curves=new Map();
 const curve=e=>{const a=new T.Vector3(...e.A.p),b=new T.Vector3(...e.B.p),m=a.clone().add(b).multiplyScalar(.5),len=a.distanceTo(b);m.y+=len*.16;m.add(new T.Vector3(-(b.z-a.z),0,b.x-a.x).normalize().multiplyScalar(len*.1));return new T.QuadraticBezierCurve3(a,m,b);};
 edges.forEach(e=>{const cv=curve(e);curves.set(e,cv);if(e.hub||e.prop)return;const c=color(colorOf(e.A.k)).lerp(color(colorOf(e.B.k)),.5);
  for(let i=0;i<Math.round(42*small);i++){const p=cv.getPoint(rnd());dust(p.x+gauss()*.16,p.y+gauss()*.07,p.z+gauss()*.16,c,.2+rnd()*.4);}});
 for(let i=0;i<Math.round(7000*small);i++){const arm=i%3,r=Math.pow(rnd(),.9)*18,a=arm*2.0944+r*.3+gauss()*(.34+.5/(1+r*.4));const c=color('#a9bdf5').lerp(color('#fff0d8'),Math.pow(1-r/17,5));dust(Math.cos(a)*r,gauss()*(.2+(18-r)*.03),Math.sin(a)*r,c,.16+rnd()*.42);}
 for(let i=0;i<Math.round(520*small);i++){const r=Math.pow(rnd(),1.5)*2.2,a=rnd()*6.2832;dust(Math.cos(a)*r,gauss()*r*.25,Math.sin(a)*r,color('#fff0d8'),.5+rnd()*1.1);}
 const dustGeo=new T.BufferGeometry();
 dustGeo.setAttribute('position',new T.Float32BufferAttribute(dp,3));dustGeo.setAttribute('color',new T.Float32BufferAttribute(dc,3));dustGeo.setAttribute('aSize',new T.Float32BufferAttribute(ds,1));dustGeo.setAttribute('aGlow',new T.Float32BufferAttribute(dg,1));
 const dustMat=mat(.8,8,7);world.add(new T.Points(dustGeo,dustMat));

 /* Stars */
 const sp=new Float32Array(nodes.length*3),sc=new Float32Array(nodes.length*3),ss=new Float32Array(nodes.length),sg=new Float32Array(nodes.length).fill(1);
 const sizeOf=n=>n.key?9:n.k==='creator'?9:n.k==='proposal'?4.2:isThought(n)?6+Math.min(n.d,14)*.3:n.d?4+Math.min(n.d,8)*.42:2.8;
 nodes.forEach((n,i)=>{sp.set(n.p,i*3);const c=color(colorOf(n.k));sc.set([c.r,c.g,c.b],i*3);ss[i]=sizeOf(n);n.v=new T.Vector3(...n.p);});
 const starGeo=new T.BufferGeometry();starGeo.setAttribute('position',new T.BufferAttribute(sp,3));starGeo.setAttribute('color',new T.BufferAttribute(sc,3));starGeo.setAttribute('aSize',new T.BufferAttribute(ss,1));starGeo.setAttribute('aGlow',new T.BufferAttribute(sg,1));
 const starMat=mat(1);world.add(new T.Points(starGeo,starMat));

 /* Threads */
 const threads=edges.map(e=>{const pts=curves.get(e).getPoints(28),c=color(colorOf(e.A.k)).lerp(color(colorOf(e.B.k)),.5);const m=e.prop?new T.LineDashedMaterial({color:color('#ffcf9e'),dashSize:.22,gapSize:.16,transparent:true,opacity:0,depthWrite:false,blending:T.AdditiveBlending}):new T.LineBasicMaterial({color:c,transparent:true,opacity:0,depthWrite:false,blending:T.AdditiveBlending});const l=new T.Line(new T.BufferGeometry().setFromPoints(pts),m);if(e.prop)l.computeLineDistances();world.add(l);return {e,m,now:0};});

 /* Light travelling along the selected star's links */
 const PULSES=48,pp=new Float32Array(PULSES*3),pc=new Float32Array(PULSES*3).fill(1),ps=new Float32Array(PULSES),pg=new Float32Array(PULSES).fill(1);
 const pulseGeo=new T.BufferGeometry();pulseGeo.setAttribute('position',new T.BufferAttribute(pp,3));pulseGeo.setAttribute('color',new T.BufferAttribute(pc,3));pulseGeo.setAttribute('aSize',new T.BufferAttribute(ps,1));pulseGeo.setAttribute('aGlow',new T.BufferAttribute(pg,1));
 const pulses=new T.Points(pulseGeo,mat(1));pulses.frustumCulled=false;world.add(pulses);

 /* Labels */
 const pool=new Map();
 nodes.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='lb'+(n.k==='concept'?' thought':n.k==='topic'?' topic':n.k==='proposal'?' proposal':n.k==='creator'?' core':'');b.innerHTML=`<span>${esc(n.t)}</span>`;b.tabIndex=-1;b.addEventListener('click',()=>select(n));b.addEventListener('pointerenter',()=>{hover=n;});b.addEventListener('pointerleave',()=>{if(hover===n)hover=null;});labelsHost.append(b);pool.set(n,b);});
 const edgeLabels=Array.from({length:8},()=>{const d=document.createElement('div');d.className='edge';labelsHost.append(d);return d;});

 /* Camera */
 let width=1,height=1,yaw=-.5,pitch=.86,radius=60,focus=new T.Vector3(),tYaw=yaw,tPitch=pitch,tRadius=30,tFocus=new T.Vector3();
 const overview=()=>{const aspect=width/height;return aspect>1?31:31+(1-aspect)*34;};
 function resize(){const r=canvas.getBoundingClientRect();width=Math.max(1,r.width);height=Math.max(1,r.height);renderer.setSize(width,height,false);camera.aspect=width/height;applyOffset();const u=height*.62;dustMat.uniforms.uScale.value=u;starMat.uniforms.uScale.value=u;pulses.material.uniforms.uScale.value=u;}
 function applyOffset(){
  const open=!reader.hidden;
  if(open&&width>820)camera.setViewOffset(width,height,(Math.min(372,width-32)+16)/2,0,width,height);
  else if(open)camera.setViewOffset(width,height,0,height*.25,width,height);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
 }
 new ResizeObserver(resize).observe(canvas);resize();
 tRadius=overview();

 function onSelect(fly){
  applyOffset();
  if(selected){
   const con=[...litBy(selected)].filter(id=>id!==selected.id).map(id=>byId.get(id).v.distanceTo(selected.v));
   tFocus.copy(selected.v);tRadius=Math.max(11,Math.min(24,(con.length?Math.max(...con):6)*2.3));
  }else{tFocus.set(0,0,0);tRadius=overview();}
  if(!fly||reduce){focus.copy(tFocus);radius=tRadius;}
 }

 /* Pointer */
 const pts=new Map();let moved=0,pinch=0,screen=nodes.map(()=>[-9e3,-9e3,1]);
 const nearest=(x,y,reach)=>{let best=null,bd=reach*reach;nodes.forEach((n,i)=>{const s=screen[i];if(s[2]<=0)return;const d=(s[0]-x)**2+(s[1]-y)**2;if(d<bd){bd=d;best=n;}});return best;};
 const local=e=>{const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pinch=0;canvas.classList.add('drag');});
 canvas.addEventListener('pointermove',e=>{
  const [x,y]=local(e);
  if(!pts.size){hover=nearest(x,y,16);canvas.classList.toggle('point',!!hover);return;}
  const prev=pts.get(e.pointerId);if(!prev)return;
  const dx=e.clientX-prev[0],dy=e.clientY-prev[1];pts.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(pts.size===1){tYaw+=dx*.005;tPitch=Math.max(.12,Math.min(1.42,tPitch+dy*.004));}
  else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)tRadius=Math.max(5,Math.min(70,tRadius*pinch/d));pinch=d;}
 });
 const end=e=>{const was=pts.size===1&&moved<8;const pos=local(e);pts.delete(e.pointerId);canvas.classList.remove('drag');if(was){const n=nearest(pos[0],pos[1],e.pointerType==='touch'?28:16);if(n)select(n);}};
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);canvas.classList.remove('drag');});
 canvas.addEventListener('pointerleave',()=>{if(!pts.size)hover=null;});
 canvas.addEventListener('wheel',e=>{e.preventDefault();tRadius=Math.max(5,Math.min(70,tRadius*Math.exp(e.deltaY*.0011)));},{passive:false});
 canvas.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft')tYaw-=.12;else if(k==='ArrowRight')tYaw+=.12;else if(k==='ArrowUp')tPitch=Math.max(.12,tPitch-.08);else if(k==='ArrowDown')tPitch=Math.min(1.42,tPitch+.08);else if(k==='+'||k==='=')tRadius=Math.max(5,tRadius*.88);else if(k==='-')tRadius=Math.min(70,tRadius*1.14);else return;e.preventDefault();});

 /* Who is lit */
 const litBy=n=>{const s=new Set([n.id]);const rel=near.get(n.id).filter(x=>(!x.e.hub||n.k==='creator')&&!hiddenEdge(x.e));rel.forEach(x=>s.add(x.o.id));if(!rel.length)n.kin.forEach(id=>s.add(id));return s;};
 const passes=n=>{
  if(matches)return matches.has(n.id);
  if(kindFilter)return kindFilter==='thought'?isThought(n):n.k===kindFilter;
  return true;
 };
 const v=new T.Vector3(),boxes=[];
 const free=(x,y,w,h)=>{for(const b of boxes)if(x<b[0]+b[2]+6&&x+w+6>b[0]&&y<b[1]+b[3]+3&&y+h+3>b[1])return false;boxes.push([x,y,w,h]);return true;};
 const widths=new Map();
 let last=performance.now(),time=0,frame=0;
 function draw(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;frame++;
  const ease=reduce?1:1-Math.exp(-dt*(pts.size?14:3.2));
  yaw+=(tYaw-yaw)*ease;pitch+=(tPitch-pitch)*ease;radius+=(tRadius-radius)*ease;focus.lerp(tFocus,ease);
  camera.position.set(focus.x+Math.cos(yaw)*Math.cos(pitch)*radius,focus.y+Math.sin(pitch)*radius,focus.z+Math.sin(yaw)*Math.cos(pitch)*radius);
  camera.lookAt(focus);camera.updateMatrixWorld();

  const anchor=hover||selected,lit=anchor?litBy(anchor):null,sel=selected?litBy(selected):null,filtered=!!(matches||kindFilter);
  const glow=starGeo.attributes.aGlow;
  nodes.forEach((n,i)=>{let g=1;
   if(filtered)g=passes(n)?1.6:.14;
   if(n.k==='proposal'&&!showProposals){sg[i]=0;return;}
   if(lit)g=n===anchor?2:lit.has(n.id)?1.5:(sel&&sel.has(n.id)?1:.22);
   sg[i]+=(g-sg[i])*Math.min(1,dt*7);});
  glow.needsUpdate=true;
  dustMat.uniforms.uAlpha.value+=((anchor||filtered?.34:.8)-dustMat.uniforms.uAlpha.value)*Math.min(1,dt*4);

  threads.forEach(t=>{const {e}=t;const on=selected&&(e.a===selected.id||e.b===selected.id)&&(!e.hub||selected.k==='creator');const onH=hover&&(e.a===hover.id||e.b===hover.id)&&(!e.hub||hover.k==='creator');
   const target=hiddenEdge(e)?0:on?(e.hub?.3:1):onH?(e.hub?.25:.95):e.hub?0:(anchor||filtered)?.08:e.prop?.34:.6;
   t.now+=(target-t.now)*Math.min(1,dt*6);t.m.opacity=t.now;t.m.visible=t.now>.005;});

  /* Travelling light */
  let pi=0;if(selected&&!reduce){for(const x of near.get(selected.id)){if((x.e.hub&&selected.k!=='creator')||hiddenEdge(x.e))continue;if(pi>=PULSES)break;const cv=curves.get(x.e),dir=x.e.a===selected.id?1:-1;const u=(time*.28+pi*.137)%1,p=cv.getPoint(dir>0?u:1-u);pp[pi*3]=p.x;pp[pi*3+1]=p.y;pp[pi*3+2]=p.z;const c=color(colorOf(x.o.k));pc[pi*3]=c.r;pc[pi*3+1]=c.g;pc[pi*3+2]=c.b;ps[pi]=3.2;pi++;}}
  for(let i=pi;i<PULSES;i++)ps[i]=0;
  pulseGeo.attributes.position.needsUpdate=true;pulseGeo.attributes.color.needsUpdate=true;pulseGeo.attributes.aSize.needsUpdate=true;

  renderer.render(world,camera);

  /* Project every star for picking and labels */
  nodes.forEach((n,i)=>{v.copy(n.v).project(camera);const s=screen[i];s[0]=(v.x+1)*.5*width;s[1]=(1-v.y)*.5*height;s[2]=v.z<1?1:0;});

  /* Labels by priority: the selected star, its links, then named ideas, then the most linked records. */
  boxes.length=0;
  const open=!reader.hidden,rightLimit=open&&width>820?width-Math.min(372,width-32)-24:width;
  const bottomLimit=open&&width<=820?height*.48:height;const topLimit=width<=820?108:4;
  const rank=n=>n===selected?0:n===hover?1:(sel&&sel.has(n.id))?(n.key?1.5:2):(lit&&lit.has(n.id))?3:(passes(n)&&filtered)?3.5:n.k==='creator'?4:n.k==='concept'?5:n.k==='topic'?6:n.k==='proposal'?6.5:(n.k==='judgment'||n.k==='essay')?8:7+(10-Math.min(n.d,10))*.1;
  const order=[...nodes].sort((a,b)=>rank(a)-rank(b));
  const budget=selected?26:width<820?12:hover?20:28;let shown=0;
  order.forEach(n=>{
   const el=pool.get(n),s=screen[n.i];
   const eligible=(n.k!=='proposal'||showProposals)&&(rank(n)<4||(!anchor&&!filtered&&(n.key||n.k==='creator'||isThought(n)&&n.k!=='essay'||n.d>=4)));
   const mini=!selected&&!filtered&&!hover&&!!n.img&&(n.d>=5||n.key)&&width>1100;const asCard=(!!(selected&&n.img&&n!==selected&&sel.has(n.id))||mini)&&width>820;el.classList.toggle('mini',mini);
   if(el.classList.contains('card')!==asCard){el.classList.toggle('card',asCard);
    if(asCard&&!el.querySelector('img')){const img=new Image();img.src=n.img;img.alt='';el.prepend(img);}
    if(!asCard)el.querySelector('img')?.remove();
    widths.delete(n);}
   if(el.dataset.mini!==String(mini)){el.dataset.mini=String(mini);widths.delete(n);}
   el.classList.toggle('sel',n===selected);
   if(!eligible||s[2]<=0||shown>=budget){el.classList.remove('on');return;}
   let size=widths.get(n);if(!size){size=[el.offsetWidth||120,el.offsetHeight||18];widths.set(n,size);}
   const centered=isThought(n)||n.k==='creator';
   let x=asCard?s[0]-size[0]/2:centered?s[0]-size[0]/2:s[0]+9,y=asCard?s[1]-size[1]-10:centered?s[1]+9:s[1]-size[1]/2;
   if(x<4||y<topLimit||x+size[0]>rightLimit-4||y+size[1]>bottomLimit-4||!free(x,y,size[0],size[1])){el.classList.remove('on');return;}
   el.classList.add('on');el.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;shown++;
  });
  /* Why two stars are linked, written on the thread */
  let li=0;const said=new Set();
  if(selected){for(const x of near.get(selected.id)){if(x.e.hub||x.e.prop||li>=edgeLabels.length||said.has(x.e.l))continue;said.add(x.e.l);const p=curves.get(x.e).getPoint(.5);v.copy(p).project(camera);const sx=(v.x+1)*.5*width,sy=(1-v.y)*.5*height,d=edgeLabels[li];
    d.textContent=x.e.l;const w=d.offsetWidth||80;
    if(v.z<1&&sx-w/2>4&&sx+w/2<rightLimit&&sy>4&&sy<bottomLimit-16&&free(sx-w/2,sy-9,w,18)){d.classList.add('on');d.style.transform=`translate(${Math.round(sx-w/2)}px,${Math.round(sy-9)}px)`;li++;}}}
  for(let i=li;i<edgeLabels.length;i++)edgeLabels[i].classList.remove('on');

  requestAnimationFrame(draw);
 }
 scene={onSelect};
 requestAnimationFrame(draw);
 window.__galaxy={select:id=>select(byId.get(id)),state:()=>({selected:selected?.id,shown:labelsHost.querySelectorAll('.lb.on').length,radius,frame})};
}
if(window.THREE){try{start();}catch(err){$('fallback').hidden=false;}}else{$('fallback').hidden=false;}
})();
</script>
