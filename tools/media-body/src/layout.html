<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000">{{META}}<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="preload" href="assets/lecture-serif.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/lecture-sans.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css?v={{VERSION}}"><script type="application/ld+json">{{SCHEMA}}</script><script type="application/json" id="media-settings">{{SETTINGS}}</script><script defer src="motion.js?v={{VERSION}}"></script><script defer src="deck.js?v={{VERSION}}"></script></head>
<body><a class="skip" href="#stage">강의 내용으로 건너뛰기</a><div class="app"><header class="app-header"><a class="brand" href="https://mirinaeman.com/" aria-label="미리내맨 홈">MEDIA <span>/</span> BODY</a><span class="edition">김준호의 미디어 철학</span><nav class="app-actions js-only" aria-label="발표 도구">{{CONTROLS}}</nav></header><main id="stage" class="stage" aria-label="매체는 메시지의 몸 36장 강의">{{SCENES}}</main><footer class="toolbar js-only"><span class="position"><b id="position">01</b><span>/ {{COUNT}}</span></span><nav class="phase-nav" aria-label="강의 구간">{{PHASES}}</nav><div class="travel"><button type="button" id="previous" aria-label="이전 슬라이드">←</button><button type="button" id="next" aria-label="다음 슬라이드">다음 →</button></div><div class="progress" aria-hidden="true"><i id="progress"></i></div></footer></div>
<dialog id="outline" aria-labelledby="outline-title"><header class="dialog-top"><div><span class="micro">THE CONTENTS</span><h2 id="outline-title">메시지가 몸을 얻는 순서</h2></div><button type="button" data-close aria-label="목차 닫기">{{CLOSE}}</button></header><nav class="outline-grid" aria-label="전체 슬라이드">{{OUTLINE}}</nav><footer class="dialog-bottom"><label><input type="checkbox" id="reduce-motion"> 움직임 줄이기</label><span>← → · Space로 진행 / R로 다시 보기</span><a href="https://mirinaeman.com/profile/">김준호 · 미리내맨 ↗</a></footer></dialog>
<dialog id="image-dialog" aria-labelledby="image-title"><header class="dialog-top"><h2 id="image-title">참고 이미지</h2><button type="button" data-close aria-label="이미지 닫기">{{CLOSE}}</button></header><div class="image-scroll"><img id="expanded-image" alt=""></div><footer class="dialog-bottom"><button type="button" id="image-zoom">실제 크기로 보기</button><span>원본 자료 · Esc로 닫기</span></footer></dialog>
<dialog id="share-dialog" aria-labelledby="share-title"><header class="dialog-top"><h2 id="share-title">페이지 공유</h2><button type="button" data-close aria-label="공유 닫기">{{CLOSE}}</button></header><label for="share-url">페이지 주소</label><input id="share-url" readonly><button type="button" id="copy-link">주소 복사</button></dialog>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p><p id="notice" role="status" aria-live="polite"></p><noscript><p class="no-script">강의 전체를 아래로 읽을 수 있습니다.<br>참고 이미지는 각 장에서 볼 수 있습니다.</p></noscript></body></html>
