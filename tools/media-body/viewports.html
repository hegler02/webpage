<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Media Body — 화면 크기 검토</title><style>body{margin:0;background:#222;color:white;font:14px sans-serif}nav{height:60px;display:flex;align-items:center;gap:15px;padding:0 20px}button{background:#111;color:white;border:1px solid #777;padding:10px}main{overflow:auto;padding:20px;display:flex;justify-content:center}iframe{background:black;border:0;width:390px;height:760px;flex-shrink:0}</style></head><body><nav aria-label="검토 화면 크기"><button data-width="390" data-height="760">모바일 390</button><button data-width="768" data-height="900">태블릿 768</button><button data-width="1440" data-height="900">데스크톱 1440</button><span id="label">390 × 760</span></nav><main><iframe title="미디어 철학 강의" src="../../pages/media/"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.width+'px';f.style.height=b.dataset.height+'px';document.querySelector('#label').textContent=b.dataset.width+' × '+b.dataset.height})</script></body></html>
